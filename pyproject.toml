[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avat"
version = "0.1.0"
description = "Frame-accurate accident video review and investigation desktop tool"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.7,<7",
    "opencv-python==4.11.0.86",
    "numpy==2.1.3",
]

[project.optional-dependencies]
# 현재 실행·배포 대상은 Grounding DINO입니다. 비교용 백엔드 코드는 별도로 보존합니다.
detection = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.20.2",
    "pillow==11.1.0",
]
dev = [
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.6,<1",
]

[project.gui-scripts]
avat = "investigator.app:main"

[tool.setuptools.packages.find]
include = ["investigator*"]

[tool.setuptools.package-data]
investigator = ["assets/material_symbols/*", "assets/fonts/*", "assets/*.xlsx", "assets/*.docx", "assets/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Ultralytics can create an "Ultralytics/" settings folder in the project root;
# on case-insensitive Windows, ruff would then sort the package as first-party.
known-third-party = ["ultralytics"]
